<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Órdenes de Compra</title>
<style>
  :root{--bg:#f6f7f5;--panel:#fff;--ink:#17201b;--muted:#5f6b64;--line:#e2e6e3;--brand:#1f6b3a;--brand-soft:#e7f2ea;--ok:#1f7a45;--warn:#a86400;--warn-soft:#fff4e0;--bad:#b42318;--bad-soft:#fdecea;--code:#f1f3f2}
  @media (prefers-color-scheme:dark){:root{--bg:#111513;--panel:#181e1b;--ink:#e6ece8;--muted:#9aa7a0;--line:#2a332e;--brand:#4fbf78;--brand-soft:#1c2c22;--ok:#5ccf8a;--warn:#f0b257;--warn-soft:#2e2414;--bad:#ff8a80;--bad-soft:#331a19;--code:#1f2622}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}header .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}.modo{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .modo button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.modo button.on{background:var(--brand);color:#fff}
  .nueva{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  main{max-width:920px;margin:0 auto;padding:20px 16px 200px}
  .msg{margin:14px 0;display:flex}.msg.user{justify-content:flex-end}
  .bubble{max-width:88%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
  .user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bot.confirm .bubble{border:2px solid var(--warn);background:var(--warn-soft)}
  .bubble table{border-collapse:collapse;margin:6px 0;font-size:13px;white-space:normal}.bubble td,.bubble th{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .tool{margin:6px 0;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;background:var(--panel);font-size:13px}
  .tool.err{border-left-color:var(--bad)}.tool summary{cursor:pointer;padding:7px 12px;display:flex;gap:8px;align-items:baseline;list-style:none;flex-wrap:wrap}
  .tool summary::-webkit-details-marker{display:none}.tool .name{font-family:ui-monospace,Menlo,monospace;font-weight:600}.tool .res{color:var(--muted)}.tool .ms{color:var(--muted);margin-left:auto;font-size:12px}
  .tool pre{margin:0;padding:10px 12px;background:var(--code);border-top:1px solid var(--line);overflow:auto;max-height:300px;font-size:12px}
  .banner{margin:10px 0;padding:12px 14px;border:2px solid var(--warn);background:var(--warn-soft);border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .banner b{color:var(--warn)}.btn{border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn.ok{background:var(--ok);color:#fff}.btn.no{background:transparent;border:1px solid var(--bad);color:var(--bad)}.btn:disabled{opacity:.5;cursor:default}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 12px}
  .chips{max-width:920px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}.chip:hover{border-color:var(--brand)}
  form{max-width:920px;margin:0 auto;display:flex;gap:8px}form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink)}
  form button{background:var(--brand);color:#fff}.uso{max-width:920px;margin:6px auto 0;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .typing{color:var(--muted);font-size:13px;margin:10px 0}.empty{color:var(--muted);text-align:center;margin-top:50px}
  @media (max-width:600px){header .sub{display:none}.bubble{max-width:96%}}
</style>
</head>
<body>
<header>
  <div><h1>Agente de Órdenes de Compra</h1><div class="sub">Paquete → reglas RC1–RC10 → payload → confirmación humana → OC en SAP simulado</div></div>
  <div class="spacer"></div>
  <div class="modo" role="group" aria-label="Modo"><button data-m="llm" class="on">Con LLM</button><button data-m="reglas">Sin LLM</button></div>
  <button class="nueva" id="nueva" type="button">Nueva sesión</button>
</header>
<main id="chat"><div class="empty" id="empty">Escribe por ejemplo <b>procesa la solicitud sol-004</b> o usa los atajos.</div></main>
<footer>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" autocomplete="off" placeholder='Ej.: "Procesa la solicitud sol-004 y no la crees hasta que confirme"'><button class="btn" id="send">Enviar</button></form>
  <div class="uso" id="uso"></div>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat");
let modo = "llm", ocupado = false, sessionId = null, historial = [];
const total = { entrada: 0, salida: 0, costoUSD: 0 };
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
sessionId = store.get("sid") || null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  // Markdown mínimo: tablas, negritas, código en línea
  const lines = esc(s).split("\n"); const out = []; let tabla = [];
  const flush = () => { if (!tabla.length) return; const filas = tabla.filter((l) => !/^\|?\s*:?-{2,}/.test(l.replace(/\|/g, "|").trim().replace(/^\|/, ""))); out.push("<table>" + filas.map((l, i) => "<tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map((c) => i === 0 ? `<th>${c.trim()}</th>` : `<td>${c.trim()}</td>`).join("") + "</tr>").join("") + "</table>"); tabla = []; };
  for (const l of lines) { if (/^\s*\|.*\|\s*$/.test(l)) tabla.push(l); else { flush(); out.push(l); } }
  flush();
  return out.join("\n").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n?(<table>)/g, "$1").replace(/(<\/table>)\n?/g, "$1");
}
function add(html, cls = "") { $("#empty")?.remove(); const d = document.createElement("div"); d.className = cls; d.innerHTML = html; chat.appendChild(d); d.scrollIntoView({ block: "end", behavior: "smooth" }); return d; }
const burbuja = (who, text, extra = "") => add(`<div class="bubble">${md(text)}</div>`, `msg ${who} ${extra}`);

function toolCard(t) {
  add(`<details class="tool ${t.ok ? "" : "err"}"><summary>🔧 <span class="name">${esc(t.nombre)}</span><span class="res">${esc(t.resumen)}</span><span class="ms">${t.ms} ms</span></summary><pre>argumentos: ${esc(JSON.stringify(t.args, null, 2))}\n\nresultado: ${esc(JSON.stringify(t.resultado, null, 2))}</pre></details>`);
}

function banner() {
  const d = add(`<div class="banner"><b>⚠ El agente espera tu confirmación.</b><span class="spacer"></span><button class="btn ok" type="button">Confirmo, crear la OC</button><button class="btn no" type="button">No confirmo</button></div>`);
  const [ok, no] = d.querySelectorAll("button");
  const fin = () => { ok.disabled = no.disabled = true; };
  ok.onclick = () => { fin(); enviar("Confirmo"); };
  no.onclick = () => { fin(); enviar("No confirmo, no crees la OC"); };
}

async function enviar(texto) {
  if (ocupado) return; ocupado = true; $("#send").disabled = true;
  burbuja("user", texto);
  const t = add("Pensando…", "typing");
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId, message: texto, modo, historial }) });
    const d = await res.json(); t.remove();
    if (!res.ok || d.ok === false) { burbuja("bot", "⚠ " + (d.error || "Error")); return; }
    sessionId = d.sessionId; store.set("sid", sessionId); historial = d.historial || [];
    for (const tc of d.toolCalls) toolCard(tc);
    burbuja("bot", d.reply, d.needsConfirmation ? "confirm" : "");
    if (d.needsConfirmation) banner();
    total.entrada += d.uso.entrada; total.salida += d.uso.salida; total.costoUSD += d.uso.costoUSD;
    $("#uso").innerHTML = `<span>Modo: <b>${d.modo === "reglas" ? "sin LLM" : esc(d.modo)}</b></span><span>Sesión: ${esc(sessionId.slice(0, 8))}</span><span>Tokens: ${total.entrada.toLocaleString()} in / ${total.salida.toLocaleString()} out</span><span>Costo estimado: US$ ${total.costoUSD.toFixed(4)}</span>`;
  } catch (e) { t.remove(); burbuja("bot", "⚠ Error de red: " + e.message + ". Puedes reintentar; la sesión sigue activa."); }
  finally { ocupado = false; $("#send").disabled = false; }
}

$("#f").onsubmit = (ev) => { ev.preventDefault(); const v = $("#q").value.trim(); if (!v) return; $("#q").value = ""; enviar(v); };
const atajos = ["¿Qué solicitudes hay?", "Procesa la solicitud sol-001", "Procesa sol-002", "Procesa sol-003", "Procesa la solicitud \"sol-004\". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.", "Procesa sol-005", "Procesa sol-006"];
$("#chips").innerHTML = atajos.map((a) => `<button class="chip" type="button" title="${esc(a)}">${esc(a.length > 40 ? a.slice(0, 38) + "…" : a)}</button>`).join("");
$("#chips").onclick = (e) => { const b = e.target.closest(".chip"); if (b) enviar(b.title); };
document.querySelectorAll(".modo button").forEach((b) => b.onclick = () => { modo = b.dataset.m; document.querySelectorAll(".modo button").forEach((x) => x.classList.toggle("on", x === b)); add(`Modo <b>${modo === "llm" ? "con LLM" : "sin LLM (reglas)"}</b>.`, "typing"); });
$("#nueva").onclick = () => { sessionId = null; historial = []; store.set("sid", ""); chat.innerHTML = '<div class="empty" id="empty">Sesión nueva.</div>'; };
fetch("/api/health").then((r) => r.json()).then((h) => { if (h.provider === "reglas") document.querySelector('[data-m="reglas"]').click(); }).catch(() => {});
</script>
</body>
</html>
